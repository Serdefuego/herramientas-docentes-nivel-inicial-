<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f8;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007BFF;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #555;
        }
        .form-group select, .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
            color: #333;
        }
        .btn {
            background-color: #007BFF;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .attendance-list {
            margin-top: 20px;
        }
        .attendance-list div {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #fafafa;
        }
        .attendance-list label {
            display: block;
            margin: 5px 0;
        }
        .attendance-list input[type="checkbox"] {
            margin-right: 10px;
        }
        .attendance-list input[type="checkbox"]:checked + label {
            color: #007BFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registro de Asistencia</h1>
        
        <div class="form-group">
            <label for="color">Color:</label>
            <select id="color" onchange="updateStudents()">
                <option value="">Seleccione un color</option>
                <option value="Violeta">Violeta</option>
                <option value="Naranja">Naranja</option>
                <option value="Verde">Verde</option>
                <option value="Turquesa">Turquesa</option>
            </select>
        </div>

        <div class="form-group">
            <label for="turno">Turno:</label>
            <select id="turno" onchange="updateStudents()">
                <option value="">Seleccione un turno</option>
                <option value="Mañana">Mañana</option>
                <option value="Tarde">Tarde</option>
            </select>
        </div>

        <div class="form-group">
            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha">
        </div>

        <div id="attendance-list" class="attendance-list"></div>

        <button class="btn" onclick="generateText()">Generar Texto</button>

        <div id="output" style="margin-top: 20px;"></div>
    </div>

        function updateStudents() {
            const color = document.getElementById('color').value;
            const turno = document.getElementById('turno').value;
            const attendanceList = document.getElementById('attendance-list');

            // Clear existing attendance list
            attendanceList.innerHTML = '';

            if (color && turno) {
                const studentsList = students[color][turno];
                studentsList.forEach(student => {
                    const div = document.createElement('div');
                    div.innerHTML = `
                        <label>
                            <input type="checkbox" name="${student}" value="Presente"> ${student} - Presente
                        </label>
                        <label>
                            <input type="checkbox" name="${student}" value="Ausente"> Ausente
                        </label>
                    `;
                    attendanceList.appendChild(div);
                });
            }
        }

        function generateText() {
            const color = document.getElementById('color').value;
            const turno = document.getElementById('turno').value;
            const fecha = document.getElementById('fecha').value;
            const output = document.getElementById('output');

            if (color && turno && fecha) {
                const checkboxes = document.querySelectorAll('#attendance-list input[type="checkbox"]');
                let text = `Listado de alumnos para el día ${fecha} en el turno ${turno} de la sala ${color}:`;
                
                checkboxes.forEach(checkbox => {
                    if (checkbox.checked) {
                        text += `\n${checkbox.parentElement.textContent.trim()} - ${checkbox.value}`;
                    }
                });

                // Create a blob and download it as a .txt file
                const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                const fileName = `${color}_${turno}_${fecha}.txt`;
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.click();
                URL.revokeObjectURL(url);

                output.textContent = 'Archivo generado: ' + fileName;
            } else {
                output.textContent = 'Por favor, complete todos los campos.';
            }
        }
    </script>
